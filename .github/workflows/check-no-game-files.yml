name: No game files
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository has no game files
        run: python3 scripts/check_no_game_files.py
      - name: Release ZIP would have no game files
        run: |
          git archive --format=zip -o release-check.zip HEAD
          python3 scripts/check_no_game_files.py --zip release-check.zip
